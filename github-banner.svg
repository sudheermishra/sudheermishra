<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d0d"/>
      <stop offset="50%" style="stop-color:#0a0a2e"/>
      <stop offset="100%" style="stop-color:#0d0d0d"/>
    </linearGradient>
    <linearGradient id="codeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#00ff88;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g opacity="0.08" stroke="#00ff88" stroke-width="0.5">
    <line x1="0" y1="50" x2="1200" y2="50"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="250" x2="1200" y2="250"/>
    <line x1="100" y1="0" x2="100" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="300"/>
    <line x1="400" y1="0" x2="400" y2="300"/>
    <line x1="500" y1="0" x2="500" y2="300"/>
    <line x1="600" y1="0" x2="600" y2="300"/>
    <line x1="700" y1="0" x2="700" y2="300"/>
    <line x1="800" y1="0" x2="800" y2="300"/>
    <line x1="900" y1="0" x2="900" y2="300"/>
    <line x1="1000" y1="0" x2="1000" y2="300"/>
    <line x1="1100" y1="0" x2="1100" y2="300"/>
  </g>

  <!-- Floating particles -->
  <circle cx="50" cy="80" r="2" fill="#00ff88" opacity="0.6" filter="url(#glow)">
    <animate attributeName="cy" values="80;60;80" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="200" r="1.5" fill="#7c3aed" opacity="0.8" filter="url(#glow)">
    <animate attributeName="cy" values="200;180;200" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="50" r="2" fill="#f59e0b" opacity="0.7" filter="url(#glow)">
    <animate attributeName="cy" values="50;70;50" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="100" r="1.5" fill="#00ff88" opacity="0.5" filter="url(#glow)">
    <animate attributeName="cy" values="100;120;100" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1050" cy="220" r="2" fill="#ec4899" opacity="0.7" filter="url(#glow)">
    <animate attributeName="cy" values="220;200;220" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="270" r="1.5" fill="#7c3aed" opacity="0.6" filter="url(#glow)">
    <animate attributeName="cy" values="270;250;270" dur="4.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1150" cy="60" r="2" fill="#00ff88" opacity="0.5" filter="url(#glow)">
    <animate attributeName="cy" values="60;40;60" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Scrolling code rain on left -->
  <g font-family="monospace" font-size="11" fill="#00ff88" opacity="0.25" filter="url(#glow)">
    <text x="20" y="20">
      const auth = () =&gt; {
      <animate attributeName="y" values="20;320;20" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="20" y="40">
      &nbsp;&nbsp;fetch('/api/user')
      <animate attributeName="y" values="40;340;40" dur="8s" begin="1s" repeatCount="indefinite"/>
    </text>
    <text x="20" y="60">
      &nbsp;&nbsp;.then(res =&gt; res.json())
      <animate attributeName="y" values="60;360;60" dur="8s" begin="2s" repeatCount="indefinite"/>
    </text>
    <text x="20" y="80">
      &nbsp;&nbsp;.catch(console.error)
      <animate attributeName="y" values="80;380;80" dur="8s" begin="3s" repeatCount="indefinite"/>
    </text>
    <text x="20" y="100">
      }
      <animate attributeName="y" values="100;400;100" dur="8s" begin="4s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Scrolling code rain on right -->
  <g font-family="monospace" font-size="11" fill="#7c3aed" opacity="0.25" filter="url(#glow)">
    <text x="1000" y="30">
      import React from 'react'
      <animate attributeName="y" values="30;330;30" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="1000" y="50">
      const [state, setState]
      <animate attributeName="y" values="50;350;50" dur="9s" begin="1.5s" repeatCount="indefinite"/>
    </text>
    <text x="1000" y="70">
      &nbsp;= useState(null)
      <animate attributeName="y" values="70;370;70" dur="9s" begin="3s" repeatCount="indefinite"/>
    </text>
    <text x="1000" y="90">
      useEffect(() =&gt; {}, [])
      <animate attributeName="y" values="90;390;90" dur="9s" begin="4.5s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Rocket ship -->
  <g filter="url(#glowStrong)">
    <animateTransform attributeName="transform" type="translate" values="-80,280; 1280,-80" dur="6s" repeatCount="indefinite" calcMode="linear"/>
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="12" ry="28" fill="#e2e8f0" transform="rotate(-45)"/>
    <!-- Nose -->
    <polygon points="0,-28 -8,-10 8,-10" fill="#ef4444" transform="rotate(-45)"/>
    <!-- Window -->
    <circle cx="0" cy="0" r="5" fill="#7c3aed" transform="rotate(-45) translate(0,-8)" opacity="0.9"/>
    <!-- Flame -->
    <ellipse cx="0" cy="0" rx="6" ry="14" fill="#f59e0b" transform="rotate(-45) translate(0,24)" opacity="0.9">
      <animate attributeName="ry" values="14;18;10;14" dur="0.2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="0" rx="3" ry="8" fill="#ffffff" transform="rotate(-45) translate(0,24)" opacity="0.7">
      <animate attributeName="ry" values="8;12;6;8" dur="0.2s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Second rocket (delayed) -->
  <g filter="url(#glowStrong)">
    <animateTransform attributeName="transform" type="translate" values="-80,280; 1280,-80" dur="6s" begin="3s" repeatCount="indefinite" calcMode="linear"/>
    <ellipse cx="0" cy="0" rx="10" ry="22" fill="#cbd5e1" transform="rotate(-45)"/>
    <polygon points="0,-22 -6,-8 6,-8" fill="#7c3aed" transform="rotate(-45)"/>
    <circle cx="0" cy="0" r="4" fill="#00ff88" transform="rotate(-45) translate(0,-6)" opacity="0.9"/>
    <ellipse cx="0" cy="0" rx="5" ry="11" fill="#ec4899" transform="rotate(-45) translate(0,18)" opacity="0.9">
      <animate attributeName="ry" values="11;15;8;11" dur="0.3s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Main title -->
  <text x="600" y="115" text-anchor="middle" font-family="'Courier New', monospace" font-size="52" font-weight="900" fill="#00ff88" filter="url(#glowStrong)" letter-spacing="4">
    &lt;Sudheer /&gt;
    <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite"/>
  </text>

  <!-- Subtitle -->
  <text x="600" y="158" text-anchor="middle" font-family="'Courier New', monospace" font-size="20" fill="#a78bfa" filter="url(#glow)" letter-spacing="2">
    Full-Stack Developer
    <animate attributeName="opacity" values="0.8;1;0.8" dur="1.5s" repeatCount="indefinite"/>
  </text>

  <!-- Typing cursor effect -->
  <rect x="780" y="138" width="12" height="22" fill="#a78bfa" opacity="1">
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
  </rect>

  <!-- Tech stack badges -->
  <!-- React -->
  <g transform="translate(370, 185)">
    <rect rx="8" ry="8" width="80" height="28" fill="#0d1117" stroke="#61dafb" stroke-width="1.5" opacity="0.9"/>
    <text x="40" y="19" text-anchor="middle" font-family="monospace" font-size="13" fill="#61dafb" font-weight="bold">⚛ React</text>
  </g>
  <!-- Node.js -->
  <g transform="translate(465, 185)">
    <rect rx="8" ry="8" width="80" height="28" fill="#0d1117" stroke="#68a063" stroke-width="1.5" opacity="0.9"/>
    <text x="40" y="19" text-anchor="middle" font-family="monospace" font-size="13" fill="#68a063" font-weight="bold">⬡ Node</text>
  </g>
  <!-- MongoDB -->
  <g transform="translate(560, 185)">
    <rect rx="8" ry="8" width="90" height="28" fill="#0d1117" stroke="#4db33d" stroke-width="1.5" opacity="0.9"/>
    <text x="45" y="19" text-anchor="middle" font-family="monospace" font-size="13" fill="#4db33d" font-weight="bold">🍃 Mongo</text>
  </g>
  <!-- Next.js -->
  <g transform="translate(665, 185)">
    <rect rx="8" ry="8" width="80" height="28" fill="#0d1117" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
    <text x="40" y="19" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffffff" font-weight="bold">▲ Next</text>
  </g>
  <!-- Express -->
  <g transform="translate(760, 185)">
    <rect rx="8" ry="8" width="90" height="28" fill="#0d1117" stroke="#f59e0b" stroke-width="1.5" opacity="0.9"/>
    <text x="45" y="19" text-anchor="middle" font-family="monospace" font-size="13" fill="#f59e0b" font-weight="bold">◈ Express</text>
  </g>

  <!-- Animated underline scan -->
  <rect x="0" y="295" width="1200" height="2" fill="url(#codeGlow)" opacity="0.8">
    <animate attributeName="x" values="-1200;1200" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Bottom marquee text -->
  <text y="265" font-family="monospace" font-size="12" fill="#374151" letter-spacing="3">
    &lt;!-- building the future, one commit at a time --&gt; &nbsp;&nbsp;&nbsp;&nbsp; &lt;!-- building the future, one commit at a time --&gt;
    <animate attributeName="x" values="1200;-1200" dur="14s" repeatCount="indefinite" calcMode="linear"/>
  </text>

  <!-- Stars twinkling -->
  <circle cx="480" cy="35" r="1.5" fill="white" opacity="0.4">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="630" cy="20" r="1" fill="white" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="820" cy="45" r="1.5" fill="white" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="260" r="1" fill="white" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="960" cy="280" r="1.5" fill="white" opacity="0.4">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.3s" repeatCount="indefinite"/>
  </circle>
</svg>
